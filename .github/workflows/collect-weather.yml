name: Collect Seoul Weather

on:
  schedule:
    # GitHub Actions uses UTC.  This runs at 5 minutes past every hour.
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Collect weather data
        run: python scripts/collect_weather.py

      - name: Commit and push CSV changes
        run: |
          if git diff --quiet -- data/weather.csv; then
            echo "No new weather data to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather.csv
          git commit -m "chore: collect Seoul weather data"
          git push
